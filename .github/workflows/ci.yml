name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Lint, Test, and Reproducible Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libdbus-1-dev pkg-config libssl-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          (curl -sLf "https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/stellar.tar.gz && sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin/) || cargo install --locked stellar-cli --version 28.1.0
          stellar version || true

      - name: Run verification checks (fmt, clippy, tests, build, metadata)
        run: ./scripts/check.sh

      - name: Run deployed testnet integration test matrix
        run: cargo test --test deployed_testnet -- --nocapture
