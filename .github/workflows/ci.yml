name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Lint, Test, and Reproducible Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libdbus-1-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --version 28.1.0

      - name: Run verification checks (fmt, clippy, tests, build, metadata)
        run: ./scripts/check.sh

      - name: Run deployed testnet integration test matrix
        run: cargo test --test deployed_testnet -- --nocapture
