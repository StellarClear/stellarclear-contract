name: Release Verification

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.*"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  verify-release:
    name: Reproducible Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libdbus-1-dev pkg-config libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --version 28.1.0

      - name: Run verification suite
        run: ./scripts/check.sh

      - name: Verify release artifact chain
        run: ./scripts/verify-artifact.sh
