name: Release Verification

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths:
      - "contracts/**"
      - "Cargo.*"
      - "scripts/**"
      - ".github/workflows/**"

jobs:
  verify-release:
    name: Reproducible Release Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dbus libdbus-1-dev pkg-config libssl-dev libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.84.0
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          (curl -sLf "https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz" -o /tmp/stellar.tar.gz && sudo tar -xzf /tmp/stellar.tar.gz -C /usr/local/bin/) || cargo install --locked stellar-cli --version 28.1.0
          stellar version || true

      - name: Run verification suite
        run: ./scripts/check.sh

      - name: Build release WASM artifact
        run: ./scripts/build.sh

      - name: Verify release artifact chain
        run: ./scripts/verify-artifact.sh

      - name: Run deployed testnet test matrix
        run: cargo test --test deployed_testnet -- --nocapture
